
<!DOCTYPE html> 
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>停车场信息管理</title>
  
  <link rel="stylesheet" href="style.css">
  
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
</head>
    
<body>
      <div class="container">
      
          <h1>🚗 停车场信息</h1>

          <!-- 地区选择 -->
          <fieldset>
                  <legend>选择地区</legend>
                  
                  <select id="prov" onchange="showCity(this)">
                  <option value="">选择省</option>
                  </select>
                  
                  <select id="city" onchange="showCountry(this)">
                  <option value="">选择市</option>
                  </select>
                  
                  <select id="country">
                  <option value="">选择区</option>
                  </select>
          
          </fieldset>
      
          <input id="parking_name" placeholder="停车场名称">
          <input id="nearest_subway" placeholder="邻近地铁站">
          <input id="fee_standard" placeholder="是否免费">
          <input id="garage_type" placeholder="地面/地库">
          <input id="charging_pile" placeholder="是否有充电桩">
          <input id="update_time" placeholder="更新时间">
          <input id="toll_sign" placeholder="收费牌">
          <input id="contributors" placeholder="贡献者">
          <input id="remark" placeholder="备注">
      
          <button onclick="addParking()">➕ 添加</button>
      
          <div id="list"></div>
      
      </div>

      <script src="city.js"></script>
      <script src="method01.js"></script>


    <script>
      const supabaseClient = window.supabase.createClient(
        'https://xgxukhkmbxwhpsuxikwj.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhneHVraGttYnh3aHBzdXhpa3dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMDA1NDEsImV4cCI6MjA4NTY3NjU0MX0.NJFbqCgqeyfqVms9XAiugNXwV24WJg9zh9ZzF7HEUGM'
      )
    
      setInterval(load, 60000000)
     
      // ✅ 页面加载完成 → 自动拉数据
      document.addEventListener("DOMContentLoaded", () => {
        console.log("📄 页面加载完成，开始拉数据")
        load()
      })
    
      async function load() {
        const { data, error } = await supabaseClient
          .from('parkings')
          .select('*')
          .order('id', { ascending: false })
    
        console.log('📦 load() 返回', data, error)
    
        if (error) {
          alert(error.message)
          return
        }
    
        document.getElementById('list').innerHTML =
          data.map(p => `
            <div class="parking-item">
              <strong>${p.parking_name}</strong><br>
              就近${p.nearest_subway}<br>
              ${p.fee_standard}<br>
              ${p.garage_type}<br>
              ${p.charging_pile}<br>
              ${p.update_time}<br>
              ${p.toll_sign}<br>
              ${p.contributors}<br>
              ${p.remark}<br>
              
            </div>
          `).join('')
      }
    
      async function addParking() {
        const province = document.getElementById('prov').value
        const city = document.getElementById('city').value
        const district = document.getElementById('country').value
        const parking_name = document.getElementById('parking_name').value
        const nearest_subway = document.getElementById('nearest_subway').value
        const fee_standard = document.getElementById('fee_standard').value
        const garage_type = document.getElementById('garage_type').value
        const charging_pile = document.getElementById('charging_pile').value
        const update_time = document.getElementById('update_time').value
        const toll_sign = document.getElementById('toll_sign').value
        const contributors = document.getElementById('contributors').value
        const remark = document.getElementById('remark').value
    
        await supabaseClient.from('parkings').insert([
                  {
                      province,
                      city,
                      district,
                      parking_name,
                      nearest_subway,
                      fee_standard,
                      garage_type,
                      charging_pile,
                      update_time,
                      toll_sign,
                      contributors,
                      remark
                    }
          ])

        if (error) {
            alert("添加失败：" + error.message)
            console.log(error)
            return
          }

        console.log("添加成功", data)
    
        load()
      }
    
      // ✅ Realtime
      supabaseClient
        .channel('parkings-realtime')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'parkings' },
          payload => {
            console.log('📡 实时更新', payload)
            load()
          }
        )
        .subscribe()
      
    </script>

    </body>

</html>
