<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>停车场信息管理</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 40px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 20px 30px;
      border-radius: 8px;
    } 
    input, button {
      padding: 10px;
      margin: 6px 0;
      width: 100%;
    }
    button {
      background: #1677ff;
      color: white;
      border: none;
    }
    .parking-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    h1 {
      font-size:10%;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>🚗 列表</h1>

  <input id="name" placeholder="名称">
  <input id="address" placeholder="地址">
  <input id="total" type="number" placeholder="总">
  <input id="free" type="number" placeholder="剩余">

  <button onclick="addParking()">➕ 添加</button>

  <div id="list"></div>
</div>

<script>
  const supabaseClient = window.supabase.createClient(
    'https://xgxukhkmbxwhpsuxikwj.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhneHVraGttYnh3aHBzdXhpa3dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMDA1NDEsImV4cCI6MjA4NTY3NjU0MX0.NJFbqCgqeyfqVms9XAiugNXwV24WJg9zh9ZzF7HEUGM'
  )
 
  async function load() {
    const { data, error } = await supabaseClient
      .from('parkings')
      .select('*')
      .order('id', { ascending: false })

    if (error) {
      alert(error.message)
      return
    }

    document.getElementById('list').innerHTML =
      data.map(p => `
        <div class="parking-item">
          <strong>${p.name}</strong><br>
          ${p.address}<br>
          剩余 ${p.free} / ${p.total}
        </div>
      `).join('')
  }

  async function addParking() {
    const name = document.getElementById('name').value
    const address = document.getElementById('address').value
    const total = document.getElementById('total').value
    const free = document.getElementById('free').value

    await supabaseClient.from('parkings').insert({
      name, address, total, free
    })

    load()
  }


  // 👇 Realtime 订阅
  const channel = supabaseClient
    .channel('parkings-realtime')
    .on(
      'postgres_changes',
      { event: '*', schema: 'public', table: 'parkings' },
      payload => {
        console.log('📡 数据变更:', payload)
        load() // 自动刷新列表
      }
    )
    .subscribe(status => {
      console.log('🔌 Realtime 状态:', status)
    })
</script>
</body>
</html>
