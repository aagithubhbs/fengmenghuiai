<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>停车场信息管理</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 40px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 20px 30px;
      border-radius: 8px;
    }
    input, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
    }
    button {
      background: #1677ff;
      color: white;
      border: none;
      cursor: pointer;
    }
    .parking-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>🚗 停车场列表</h1>

  <input id="name" placeholder="停车场名称">
  <input id="address" placeholder="地址">
  <input id="total" type="number" placeholder="总车位">
  <input id="free" type="number" placeholder="剩余车位">

  <button onclick="addParking()">➕ 添加停车场</button>

  <hr>
  <div id="list"></div>
</div>

<script>
  const supabaseClient = supabase.createClient(
    '你的_SUPABASE_URL',
    '你的_ANON_KEY'
  )

  async function loadParkings() {
    const { data, error } = await supabaseClient
      .from('parkings')
      .select('*')
      .order('id', { ascending: false })

    if (error) {
      alert(error.message)
      return
    }

    document.getElementById('list').innerHTML =
      data.map(p => `
        <div class="parking-item">
          <strong>${p.name}</strong><br>
          📍 ${p.address}<br>
          🅿️ 剩余 ${p.free}/${p.total}
        </div>
      `).join('')
  }

  async function addParking() {
    const name = document.getElementById('name').value
    const address = document.getElementById('address').value
    const total = Number(document.getElementById('total').value)
    const free = Number(document.getElementById('free').value)

    if (!name || !address) {
      alert('请填写完整信息')
      return
    }

    const { error } = await supabaseClient
      .from('parkings')
      .insert({ name, address, total, free })

    if (error) {
      alert(error.message)
      return
    }

    loadParkings()
  }

  loadParkings()
</script>
</body>
</html>
